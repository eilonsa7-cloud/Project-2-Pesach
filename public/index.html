<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a4a8a" />
  <title>סורק כשרות לפסח</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <div class="header-inner">
      <h1 class="header-title">סורק כשרות לפסח</h1>
      <p class="header-sub">סרוק ברקוד לבדיקה באתר kosharot.co.il</p>
    </div>
  </header>

  <main class="app-main">

    <!-- ===== SCANNER ===== -->
    <section class="card scanner-card">
      <div class="card-title">📷 סריקת ברקוד</div>
      <div id="reader" class="scanner-reader"></div>
      <p class="scanner-hint">כוון את המצלמה אל הברקוד עד לזיהוי אוטומטי</p>
      <div class="scanner-controls">
        <button id="btn-start" class="btn btn-primary" onclick="startScanner()">▶ התחל סריקה</button>
        <button id="btn-stop" class="btn btn-secondary hidden" onclick="stopScanner()">⏹ עצור</button>
      </div>
    </section>

    <!-- ===== BARCODE MANUAL INPUT ===== -->
    <section class="card">
      <div class="card-title">📊 חיפוש לפי ברקוד</div>
      <div class="input-row">
        <input
          id="manual-input"
          type="text"
          inputmode="numeric"
          dir="ltr"
          placeholder="הזן מספר ברקוד..."
          class="text-field"
          onkeydown="if(event.key==='Enter') triggerSearch(this.value, 'barcode')"
        />
        <button
          class="btn btn-primary"
          onclick="triggerSearch(document.getElementById('manual-input').value, 'barcode')"
        >חפש</button>
      </div>
    </section>

    <!-- ===== PRODUCT NAME SEARCH ===== -->
    <section class="card">
      <div class="card-title">🔤 חיפוש לפי שם מוצר</div>
      <div class="input-row">
        <input
          id="name-input"
          type="text"
          dir="auto"
          placeholder="הזן שם מוצר בעברית או באנגלית..."
          class="text-field"
          onkeydown="if(event.key==='Enter') triggerSearch(this.value, 'name')"
        />
        <button
          class="btn btn-primary"
          onclick="triggerSearch(document.getElementById('name-input').value, 'name')"
        >חפש</button>
      </div>
    </section>

    <!-- ===== LOADING ===== -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>מחפש מוצר...</p>
    </div>

    <!-- ===== RESULTS ===== -->
    <section id="results-section" class="hidden">

      <!-- Query badge: shows what was searched -->
      <div id="search-badge" class="search-badge"></div>

      <!-- Extracted results card -->
      <div id="results-card" class="card results-card hidden">
        <div class="card-title results-title">תוצאות מ־kosharot.co.il</div>
        <!-- Server returns sanitised HTML; injected here via innerHTML -->
        <div id="results-content" class="results-content"></div>
      </div>

      <!-- Error message (shown when proxy fails) -->
      <div id="error-msg" class="error-msg hidden"></div>

      <!-- Action buttons -->
      <div class="results-actions">
        <a id="website-link" href="#" target="_blank" class="btn btn-website">
          🌐 פתח באתר kosharot.co.il
        </a>
        <button class="btn btn-secondary btn-full" onclick="resetToScanner()">
          ↩ חיפוש נוסף
        </button>
      </div>

    </section>

    <!-- ===== HISTORY ===== -->
    <section class="card history-card">
      <div class="history-header">
        <div class="card-title">🕐 היסטוריית חיפושים</div>
        <button id="btn-clear-history" class="btn btn-secondary btn-sm" onclick="clearHistory()">
          נקה הכל
        </button>
      </div>
      <div id="history-list" class="history-list">
        <!-- Populated by app.js -->
      </div>
    </section>

  </main>

  <!-- html5-qrcode barcode scanning library (CDN) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
